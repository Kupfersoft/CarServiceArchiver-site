name: Deploy Car Service Archiver 14-language SEO site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build SEO URLs, sitemap, schema
        run: |
          touch "csa github pages/.nojekyll"
          python3 "csa github pages/scripts/build_site.py"
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as ET; d=Path("csa github pages/_site"); s=ET.parse(d/"sitemap.xml"); (d/"sitemap.txt").write_text("\n".join((x.text or "") for x in s.iter("{http://www.sitemaps.org/schemas/sitemap/0.9}loc"))+"\n",encoding="utf-8")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./csa github pages/_site"
      - id: deployment
        uses: actions/deploy-pages@v4
